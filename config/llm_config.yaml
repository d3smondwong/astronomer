active_provider: gemini  # Options: gemini | claude | huggingface

providers:
  gemini:
    model: gemini-2.0-flash-lite
    temperature: 0.7
    max_tokens: 4096
    stream: false

  claude:
    model: claude-opus-4-6
    temperature: 0.7
    max_tokens: 4096
    stream: false

  huggingface:
    model: mistralai/Mixtral-8x7B-Instruct-v0.1
    temperature: 0.7
    max_tokens: 4096
    stream: false

templates:
  system: prompts/system_prompt.jinja
  user: prompts/bazi_analysis.jinja
