active_provider: gemini  # Options: gemini | claude | huggingface

providers:
  gemini:
    model: gemini-3.1-flash-lite-preview
    temperature: 0.7
    max_tokens: 20000
    stream: false

  claude:
    model: claude-opus-4-6
    temperature: 0.7
    max_tokens: 8192
    stream: false

  huggingface:
    model: Qwen/Qwen3.5-35B-A3B
    temperature: 0.7
    max_tokens: 8192
    stream: false

templates:
  system: prompts/system_prompt.jinja
  user: prompts/life_overview_prompt.jinja

