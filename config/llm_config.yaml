active_provider: deepseek  # Options: gemini | claude | huggingface | deepseek

providers:
  gemini:
    model: gemini-3.5-flash
    temperature: 0.7
    max_tokens: 20000
    stream: false

  claude:
    model: claude-opus-4-6
    temperature: 0.7
    max_tokens: 8192
    stream: false

  huggingface:
    model: Qwen/Qwen3.5-35B-A3B
    temperature: 0.7
    max_tokens: 8192
    stream: false

  deepseek:
    model: deepseek-v4-flash      # deepseek-v4-flash | deepseek-v4-pro
    temperature: 0.7              # only applied when thinking: false
    max_tokens: 20000
    stream: false
    thinking: false               # true = emit chain-of-thought before answering
    reasoning_effort: high        # high | max (only used when thinking: true)

templates:
  system: prompts/system_prompt.jinja
  user: prompts/insights_prompt.jinja

